name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run guard selftest
        run: python hooks/gzx-guard.py --selftest
      - name: Run invariants suite
        run: python hooks/test-gzx-invariants.py
      - name: Run integration suite
        run: python hooks/test-gzx-integration.py
